name: Phrase or language correction
description: Improve the naturalness or accuracy of a course
body:
  - type: input
    id: language
    attributes:
      label: Language and variety
    validations:
      required: true
  - type: input
    id: phrase
    attributes:
      label: Phrase ID or current text
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction and context
      description: Include meaning, regional usage, politeness, gender, and reading-aid changes where relevant.
    validations:
      required: true
